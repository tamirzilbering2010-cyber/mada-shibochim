<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מד״א · ניהול הדרכות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1b2430;--mute:#66758a;--blue:#0b4f9e;--blue2:#e6effa;--red:#d7263d;--red2:#fde8eb;--line:#dde3ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1a2230;--text:#e8edf5;--mute:#93a1b5;--blue:#6aa9ff;--blue2:#1d2e47;--red:#ff6b7d;--red2:#3a1d24;--line:#2b3548;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161f;--card:#1a2230;--text:#e8edf5;--mute:#93a1b5;--blue:#6aa9ff;--blue2:#1d2e47;--red:#ff6b7d;--red2:#3a1d24;--line:#2b3548;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,Arial,"Segoe UI",sans-serif;line-height:1.5}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:4px solid var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header{background:#12315c;color:#fff}}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.cross{width:26px;height:26px;background:var(--red);border-radius:6px;position:relative;flex:none}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;inset:0;margin:auto}
.cross:before{width:16px;height:5px}.cross:after{width:5px;height:16px}
nav{display:flex;gap:4px;padding:10px 12px 0;max-width:1000px;margin:auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--mute);font:500 15px inherit;font-family:inherit;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--blue);border-color:var(--red);font-weight:700}
main{max-width:1000px;margin:auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.past{opacity:.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{font:500 14px inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0a1626}}
.btn.d{color:var(--red);border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--text);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.t{font-weight:700;font-size:17px;color:var(--blue)}
.meta{color:var(--mute);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap;margin:4px 0}
.tag{display:inline-block;background:var(--blue2);color:var(--blue);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 0 2px 4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{text-align:center;font-size:13px;color:var(--mute);padding:4px 0}
.cal .c{background:var(--card);border:1px solid var(--line);min-height:84px;padding:3px;border-radius:6px;overflow:hidden;min-width:0}
.cal .c.o{opacity:.4}.cal .c.td{border-color:var(--red);border-width:2px}
.cal .n{font-size:12px;color:var(--mute)}
.chip{display:block;width:100%;text-align:right;border:0;background:var(--blue2);color:var(--blue);border-radius:4px;font:12px inherit;font-family:inherit;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.more{font-size:11px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
.file{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.file:first-child{border-top:0}
dialog{border:0;border-radius:14px;padding:16px;width:min(560px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.s{opacity:1}
.hide{display:none!important}
@media (max-width:600px){.cal .c{min-height:60px}.chip{font-size:10px}}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px;margin-inline-start:6px;vertical-align:middle}.badge.u{background:var(--blue);color:#fff}.banner{border-color:var(--red);background:var(--red2)}header .tag{background:rgba(255,255,255,.18);color:#fff}
:root{--dayfill:#ffd24d;--dayn:#3a2a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dayfill:#7a5a00;--dayn:#fff}}
header{flex-wrap:wrap}
.cal .c.has{background:var(--dayfill);border-color:#b8860b}.cal .c.has .n{color:var(--dayn);font-weight:700;font-size:14px}.cal .c[data-a]{cursor:pointer}
.cal .chip{border:1px solid rgba(0,0,0,.2);font-weight:500}.cal .c{min-height:96px}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;margin:2px 0 2px 4px;font-weight:500}
.tp{display:flex;align-items:center;gap:4px;direction:ltr}.tp select{width:auto;flex:1}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <h1><span class="cross"></span>מד״א · ניהול הדרכות</h1>
  <div class="row"><span id="who" class="tag"></span><button class="btn" id="insb" data-i>🎨 מדריכים</button><button class="btn" id="remb" data-i>📲 תזכורות</button><button class="btn" id="exp" data-i>ייצוא CSV</button><button class="btn" id="login">כניסת מדריכים</button></div>
</header>
<nav id="tabs">
  <button data-t="board" class="on">לוח שיבוצים</button>
  <button data-t="form" data-i>שיבוץ חדש</button>
</nav>
<main>
<section id="board">
  <div class="card">
    <div class="row">
      <div class="seg" id="modes"><button data-m="list" class="on">רשימה</button><button data-m="cal">לוח שנה</button></div>
      <div class="grow" data-i style="min-width:140px"><select id="fi"></select></div>
      <div class="grow" style="min-width:140px"><input id="ft" type="search" placeholder="חיפוש לפי נושא…"></div>
    </div>
  </div>
  <div id="rem" class="card banner hide"></div>
  <div id="chg" class="card banner hide"></div>
  <div id="list"></div>
  <div id="calw" class="hide">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="btn" id="nx">◀ הבא</button><b id="mt"></b><button class="btn" id="pv">הקודם ▶</button>
    </div>
    <div class="cal" id="cal"></div>
  </div>
</section>

<section id="form" class="hide">
  <form class="card" id="f" autocomplete="off">
    <h2 id="fh" style="margin-top:0">שיבוץ חדש</h2>
    <div class="row" style="margin-bottom:10px"><select id="tp" class="grow" style="min-width:150px"></select><button type="button" class="btn" id="tpl">טען תבנית</button><button type="button" class="btn" id="tps">שמירה כתבנית</button><button type="button" class="btn d" id="tpd">מחיקה</button></div>
    <input type="hidden" id="id">
    <div class="grid">
      <input id="ins" type="hidden">
      <div><label for="top">נושא השיעור / המצגת *</label><input id="top" list="tl" required></div>
      <div style="grid-column:1/-1"><label>מצגות ומדריכים (לכל מצגת – מדריך)</label><div id="prs"></div><button type="button" class="btn" data-a="pra">+ מצגת נוספת</button><datalist id="il"></datalist></div>
      <div><label for="dt">תאריך *</label><input id="dt" type="date" required></div>
      <div><label>שעת התחלה *</label><span class="tp" data-f="st"></span><input id="st" type="hidden"></div>
      <div><label>שעת סיום *</label><span class="tp" data-f="en"></span><input id="en" type="hidden"></div>
      <div><label for="loc">מיקום / כיתה / צוות יעד</label><input id="loc"></div>
    </div>
    <datalist id="tl"><option>סכמת החייאה<option>מצבי חירום ברפואה<option>הלם<option>חשמל<option>חבישות<option>דימומים<option>חנק<option>שברים וחבלות<option>כוויות</datalist>
    <div style="margin-top:12px"><label for="pl">תוכנית השיעור (מוצגת לחניכים)</label><textarea id="pl" rows="3"></textarea></div>
    <div style="margin-top:12px"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input id="pub" type="checkbox" style="width:auto" checked> להציג שיעור זה בתצוגת החניכים</label></div>
    <div style="margin-top:12px"><label for="nt">הערות פנימיות (למדריכים בלבד)</label><textarea id="nt" rows="3"></textarea></div>
    <div style="margin-top:12px"><label for="eq">ציוד לשיעור (פריט בכל שורה)</label><textarea id="eq" rows="3" placeholder="בובת החייאה&#10;מכשיר החייאה&#10;ערכת חבישה"></textarea></div>
