<script>
// Firebase Initialization for GitHub Pages
const firebaseConfig = {
  databaseURL: "https://mada-shibochim-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

const UID = localStorage.getItem('mda_uid') || (() => {
  const v = 'u' + Math.random().toString(36).slice(2, 12);
  try { localStorage.setItem('mda_uid', v) } catch(e) {}
  return v;
})();

let docs = {}, ls = [], loaded = false;
const fire = () => ls.forEach(f => f());

// Realtime Database Sync Adapter
rtdb.ref('/').on('value', snapshot => {
  docs = snapshot.val() || {};
  loaded = true;
  fire();
});

const docL = (p, cb) => {
  let last, done = false;
  const f = () => {
    if (!loaded) return;
    // p could be like 'lessons/id' or 'config/auth'
    const parts = p.split('/');
    let d = docs;
    for (const part of parts) d = d ? d[part] : undefined;
    
    const s = JSON.stringify(d);
    if (done && s === last) return;
    done = true; last = s;
    cb({ exists: d !== undefined, data: () => d });
  };
  ls.push(f); f();
};

const colL = (c, cb) => {
  let prev = null;
  const f = () => {
    if (!loaded) return;
    const sub = docs[c] || {};
    const cur = {};
    for (const k in sub) cur[c + '/' + k] = sub[k];
    
    const old = prev || {}, ch = [];
    for (const p in cur) {
      const t = !(p in old) ? 'added' : JSON.stringify(old[p]) !== JSON.stringify(cur[p]) ? 'modified' : null;
      if (t) ch.push({ type: t, doc: { data: () => cur[p], metadata: { hasPendingWrites: false } } });
    }
    for (const p in old) if (!(p in cur)) ch.push({ type: 'removed', doc: { data: () => old[p], metadata: { hasPendingWrites: false } } });
    if (prev && !ch.length) return;
    prev = cur;
    cb({ docs: Object.keys(cur).map(p => ({ data: () => cur[p] })), docChanges: () => ch });
  };
  ls.push(f); f();
};

const wr = async (p, d) => {
  await rtdb.ref(p).set(d);
};

const DB = {
  doc: p => ({
    set: d => wr(p, d),
    delete: () => wr(p, null),
    onSnapshot: cb => docL(p, cb)
  }),
  collection: c => ({
    onSnapshot: cb => colL(c, cb)
  })
};

window.claude = { use: async n => n === 'db' ? DB : n === 'user' ? { canEdit: () => true, id: () => UID } : null };
window.__refresh = () => {};
window.chk = async h => {
  const snap = await rtdb.ref('config/auth').once('value');
  const auth = snap.val();
  return auth && auth.h === h;
};
</script>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let busy = false, L = [], INS = {}, TPL = [], FB = [], myFb = {}, tplDur = 0, fbSub = false, AS = null, U = null, AUTH = null, role = 'student', pend = [], mode = 'list', first = true, cur = new Date(); cur.setDate(1);
try { myFb = JSON.parse(localStorage.getItem('mda_myfb') || '{}') } catch(e) {}
let seen = {}; try { seen = JSON.parse(localStorage.getItem('mda_seen') || '{}') } catch(e) {}
const inst = () => role === 'inst';
const vis = () => inst() ? L : L.filter(l => l.pub);
const sorted = a => [...a].sort((x, y) => (x.dt + x.st).localeCompare(y.dt + y.st));
const saveSeen = () => { try { localStorage.setItem('mda_seen', JSON.stringify(seen)) } catch(e) {} };
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('s'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('s'), 3000); }
const size = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
const hash = async p => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('mda:' + p)))].map(b => b.toString(16).padStart(2, '0')).join('');

async function put(l) {
  l.upd = Date.now();
  if (DB) await DB.doc('lessons/' + l.id).set(l);
}
async function del(id) {
  if (DB) await DB.doc('lessons/' + id).delete();
}
async function setAuth(h) {
  if (DB) await DB.doc('config/auth').set({ h });
}
function onAuth() {
  const ph = localStorage.getItem('mda_ph');
  role = AUTH && ph && ph === AUTH.h ? 'inst' : 'student';
  if (inst() && DB && !fbSub) {
    fbSub = true;
    DB.collection('feedback').onSnapshot(s => { FB = s.docs.map(d => d.data()); renderAll(); }, () => { fbSub = false; });
  }
  applyRole(); renderAll();
}
function baseline() {
  if (first && localStorage.getItem('mda_seen') === null) { L.forEach(l => seen[l.id] = l.upd); saveSeen(); }
  first = false;
}
async function initStore() {
  try { if (window.claude) { DB = await claude.use('db'); AS = await claude.use('assets'); U = await claude.use('user'); } } catch(e) {}
  if (DB) {
    let ready = false;
    DB.collection('lessons').onSnapshot(s => {
      if (ready) s.docChanges().forEach(c => {
        if (c.doc.metadata.hasPendingWrites) return;
        const d = c.doc.data();
        if (c.type === 'removed') toast('שיעור הוסר מהלוח');
        else if (c.type === 'modified' && (inst() || (d && d.pub))) toast('עודכן: ' + d.top);
        else if (c.type === 'added' && (inst() || (d && d.pub))) toast('שיעור חדש: ' + d.top);
      });
      L = s.docs.map(d => d.data()); ready = true; baseline(); renderAll();
    }, () => toast('החיבור לנתונים המשותפים נכשל'));
    DB.doc('config/auth').onSnapshot(s => { AUTH = s.exists ? s.data() : null; onAuth(); }, () => {});
    DB.doc('config/templates').onSnapshot(s => { TPL = s.exists ? (s.data().list || []) : []; fillTpl(); }, () => {});
    DB.doc('config/instructors').onSnapshot(s => { INS = s.exists ? (s.data().map || {}) : {}; renderAll(); }, () => {});
  } else {
    try { L = JSON.parse(localStorage.getItem('mda_lessons') || '[]'); AUTH = JSON.parse(localStorage.getItem('mda_auth') || 'null'); TPL = JSON.parse(localStorage.getItem('mda_tpl') || '[]'); INS = JSON.parse(localStorage.getItem('mda_ins') || '{}'); } catch(e) {}
    baseline(); onAuth();
  }
}
async function up(list) { return []; }
async function rmFile(lid, fid) {}

const pad = n => String(n).padStart(2, '0');
const stamp = (d, t) => d.replace(/-/g, '') + 'T' + t.replace(':', '') + '00';
const fdate = d => new Date(d + 'T00:00').toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = ymd(new Date());
const tmr = ymd(new Date(Date.now() + 864e5));
const ttl = l => l.top + (inst() && l.ins ? ' – ' + l.ins : '');
const details = l => (inst() && l.ins ? 'מדריך/ה: ' + l.ins + '\n' : '') + (l.pl ? 'תוכנית: ' + l.pl + '\n' : '') + (inst() && l.nt ? 'הערות: ' + l.nt : '');
const gcal = l => 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ttl(l)) + '&dates=' + stamp(l.dt, l.st) + '/' + stamp(l.dt, l.en) + '&details=' + encodeURIComponent(details(l)) + '&location=' + encodeURIComponent(l.loc || '') + '&ctz=Asia/Jerusalem';
const ie = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const ics = l => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MDA Training//HE', 'BEGIN:VEVENT', 'UID:' + l.id + '@mda-training', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART:' + stamp(l.dt, l.st), 'DTEND:' + stamp(l.dt, l.en), 'SUMMARY:' + ie(ttl(l)), 'LOCATION:' + ie(l.loc), 'DESCRIPTION:' + ie(details(l)), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
async function saveAs(name, data) {
  const u = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return true;
}
async function doIcs(l) { await saveAs((l.top + '-' + l.dt).replace(/[\\\/:*?"<>|\s]+/g, '_') + '.ics', ics(l)); }
async function doCsv() {
  if (!L.length) return toast('אין שיבוצים לייצוא');
  const h = ['מדריך/ה', 'נושא', 'תאריך', 'התחלה', 'סיום', 'מיקום', 'תוכנית לחניכים', 'מוצג לחניכים', 'הערות פנימיות', 'קבצים'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = sorted(L).map(l => [l.ins, l.top, l.dt, l.st, l.en, l.loc, l.pl, l.pub ? 'כן' : 'לא', l.nt, (l.files || []).map(f => f.name).join(' | ')].map(q).join(','));
  await saveAs('syllabus-' + today + '.csv', '\ufeff' + [h.map(q).join(','), ...rows].join('\r\n'));
  toast('הקובץ נשמר');
}

function filtered() {
  const i = $('#fi').value, t = $('#ft').value.trim();
  return sorted(vis()).filter(l => (!i || prs(l).some(x => x.i === i)) && (!t || l.top.includes(t)));
}
function fillFilter() {
  const v = $('#fi').value, names = insNames().sort();
  $('#fi').innerHTML = '<option value="">כל המדריכים</option>' + names.map(n => `<option ${n === v ? 'selected' : ''}>${esc(n)}</option>`).join('');
}
const unseen = () => vis().filter(l => !seen[l.id] || l.upd > seen[l.id]);
function badge(l) { const s = seen[l.id]; return !s ? '<span class="badge">חדש</span>' : l.upd > s ? '<span class="badge u">עודכן</span>' : ''; }
function renderBanner() {
  const n = unseen().length; $('#chg').classList.toggle('hide', !n);
