<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מד״א · ניהול הדרכות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg: #f4f7fb; --card: #fff; --text: #1b2430; --mute: #66758a; --blue: #0b4f9e; --red: #d7263d; --line: #dde3ec; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Heebo', sans-serif; line-height: 1.5; }
header { background: var(--blue); color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid var(--red); }
header h1 { font-size: 18px; margin: 0; }
nav { display: flex; gap: 8px; padding: 10px 12px; max-width: 900px; margin: auto; }
nav button { flex: 1; border: 0; background: transparent; color: var(--mute); font-size: 16px; font-weight: bold; padding: 10px; border-bottom: 3px solid transparent; cursor: pointer; }
nav button.on { color: var(--blue); border-color: var(--red); }
main { max-width: 900px; margin: auto; padding: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
input, select, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; box-sizing: border-box; }
label { font-size: 13px; color: var(--mute); display: block; margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.btn { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
.btn.p { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.d { color: var(--red); border-color: var(--red); }
.t { font-weight: bold; font-size: 17px; color: var(--blue); }
.meta { color: var(--mute); font-size: 14px; margin: 6px 0; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .h { font-weight: bold; color: var(--mute); padding: 4px 0; }
.cal .c { background: #fff; border: 1px solid var(--line); min-height: 80px; padding: 4px; border-radius: 6px; text-align: right; }
.cal .c.o { opacity: 0.3; }
.cal .c.has { background: #fff8e1; border-color: #ffe082; }
.cal .n { font-size: 12px; font-weight: bold; color: var(--mute); }
.chip { display: block; width: 100%; background: #e6effa; color: var(--blue); border: 0; border-radius: 4px; font-size: 11px; padding: 2px 4px; margin-top: 2px; text-align: right; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; color: var(--mute); padding: 30px; }
.hide { display: none !important; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1b2430; color: #fff; padding: 8px 16px; border-radius: 20px; opacity: 0; pointer-events: none; transition: .3s; }
#toast.s { opacity: 1; }
</style>

<!-- Firebase Compat Libraries -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<header>
  <h1>מד״א · ניהול הדרכות</h1>
  <button class="btn" id="login-btn">כניסת מדריכים</button>
</header>

<nav>
  <button id="tab-board" class="on">לוח שיבוצים</button>
  <button id="tab-form" class="hide">שיבוץ חדש</button>
</nav>

<main>
  <!-- Board Section -->
  <section id="sec-board">
    <div class="card row">
      <button class="btn p" id="view-list">רשימה</button>
      <button class="btn" id="view-cal">לוח שנה</button>
      <input type="search" id="search-input" placeholder="חיפוש נושא..." class="grow" style="margin-right: 10px;">
    </div>

    <div id="list-container"></div>

    <div id="cal-container" class="hide card">
      <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
        <button class="btn" id="cal-prev">◀ חודש קודם</button>
        <b id="cal-title" style="font-size: 18px;"></b>
        <button class="btn" id="cal-next">חודש הבא ▶</button>
      </div>
      <div class="cal" id="cal-grid"></div>
    </div>
  </section>

  <!-- Form Section -->
  <section id="sec-form" class="hide card">
    <h2 id="form-title" style="margin-top:0;">שיבוץ חדש</h2>
    <form id="session-form">
      <input type="hidden" id="field-id">
      <div class="grid">
        <div>
          <label>נושא השיעור *</label>
          <input type="text" id="field-top" required placeholder="למשל: סכמת החייאה">
        </div>
        <div>
          <label>שם המדריך *</label>
          <input type="text" id="field-ins" required placeholder="שם המדריך/ה">
        </div>
        <div>
          <label>תאריך *</label>
          <input type="date" id="field-dt" required>
        </div>
        <div>
          <label>שעת התחלה *</label>
          <input type="time" id="field-st" required>
        </div>
        <div>
          <label>שעת סיום *</label>
          <input type="time" id="field-en" required>
        </div>
        <div>
          <label>מיקום / כיתה</label>
          <input type="text" id="field-loc" placeholder="למשל: כיתה א'">
        </div>
      </div>
      <div style="margin-top: 10px;">
        <label>תוכנית השיעור</label>
        <textarea id="field-pl" rows="3"></textarea>
      </div>
      <div style="margin-top: 10px;">
        <label><input type="checkbox" id="field-pub" checked style="width:auto;"> להציג לחניכים</label>
      </div>
      <div style="margin-top: 15px;" class="row">
        <button type="submit" class="btn p">שמור שיבוץ</button>
        <button type="button" class="btn" id="cancel-btn">ביטול</button>
      </div>
    </form>
  </section>
</main>

<div id="toast"></div>

<script>
// 1. Firebase Initialization
const firebaseConfig = {
  databaseURL: "https://mada-shibochim-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. State Variables
let isAdmin = false;
let sessions = {};
let currentView = 'list';
let calMonth = new Date();
calMonth.setDate(1);

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('s');
  setTimeout(() => t.classList.remove('s'), 3000);
}

// 3. Navigation & Views
document.getElementById('tab-board').onclick = () => showTab('board');
document.getElementById('tab-form').onclick = () => showTab('form');

function showTab(tab) {
  document.getElementById('tab-board').classList.toggle('on', tab === 'board');
  document.getElementById('tab-form').classList.toggle('on', tab === 'form');
  document.getElementById('sec-board').classList.toggle('hide', tab !== 'board');
  document.getElementById('sec-form').classList.toggle('hide', tab !== 'form');
}

document.getElementById('view-list').onclick = () => {
  currentView = 'list';
  document.getElementById('view-list').classList.add('p');
  document.getElementById('view-cal').classList.remove('p');
  document.getElementById('list-container').classList.remove('hide');
  document.getElementById('cal-container').classList.add('hide');
};

document.getElementById('view-cal').onclick = () => {
  currentView = 'cal';
  document.getElementById('view-cal').classList.add('p');
  document.getElementById('view-list').classList.remove('p');
  document.getElementById('list-container').classList.add('hide');
  document.getElementById('cal-container').classList.remove('hide');
  renderCalendar();
};

// 4. Admin Toggle
document.getElementById('login-btn').onclick = () => {
  if (!isAdmin) {
    const p = prompt("הכנס סיסמת מדריכים:");
    if (p) {
      isAdmin = true;
      document.getElementById('login-btn').textContent = "יציאה ממצב מדריך";
      document.getElementById('tab-form').classList.remove('hide');
      showToast("מצב מדריך פעיל");
      render();
    }
  } else {
    isAdmin = false;
    document.getElementById('login-btn').textContent = "כניסת מדריכים";
    document.getElementById('tab-form').classList.add('hide');
    showTab('board');
    showToast("יצאת ממצב מדריך");
    render();
  }
};

// 5. Firebase Sync
db.ref('sessions').on('value', (snapshot) => {
  sessions = snapshot.val() || {};
  render();
});

// 6. Form Operations
document.getElementById('session-form').onsubmit = (e) => {
  e.preventDefault();
  const id = document.getElementById('field-id').value;
  const data = {
    top: document.getElementById('field-top').value.trim(),
    ins: document.getElementById('field-ins').value.trim(),
    dt: document.getElementById('field-dt').value,
    st: document.getElementById('field-st').value,
    en: document.getElementById('field-en').value,
    loc: document.getElementById('field-loc').value.trim(),
    pl: document.getElementById('field-pl').value.trim(),
    pub: document.getElementById('field-pub').checked
  };

  const ref = id ? db.ref('sessions/' + id) : db.ref('sessions').push();
  ref.set(data, (err) => {
    if (err) {
      alert("שגיאה בשמירה: " + err.message);
    } else {
      showToast("נשמר בהצלחה!");
      resetForm();
      showTab('board');
    }
  });
};

document.getElementById('cancel-btn').onclick = () => {
  resetForm();
  showTab('board');
};

function resetForm() {
  document.getElementById('session-form').reset();
  document.getElementById('field-id').value = '';
  document.getElementById('form-title').textContent = 'שיבוץ חדש';
}

// 7. Render Functions
function render() {
  renderList();
  if (currentView === 'cal') renderCalendar();
}

function renderList() {
  const container = document.getElementById('list-container');
  const query = document.getElementById('search-input').value.toLowerCase();
  const keys = Object.keys(sessions).sort((a,b) => (sessions[a].dt + sessions[a].st).localeCompare(sessions[b].dt + sessions[b].st));

  let html = '';
  keys.forEach(key => {
    const s = sessions[key];
    if (!isAdmin && !s.pub) return;
