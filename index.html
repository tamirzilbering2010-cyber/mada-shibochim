<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מד״א · ניהול הדרכות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1b2430;--mute:#66758a;--blue:#0b4f9e;--blue2:#e6effa;--red:#d7263d;--red2:#fde8eb;--line:#dde3ec;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#1a2230;--text:#e8edf5;--mute:#93a1b5;--blue:#6aa9ff;--blue2:#1d2e47;--red:#ff6b7d;--red2:#3a1d24;--line:#2b3548;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,Arial,sans-serif;line-height:1.5}
header{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:4px solid var(--red);flex-wrap:wrap}
header h1{font-size:18px;margin:0;display:flex;align-items:center;gap:8px}
.cross{width:26px;height:26px;background:var(--red);border-radius:6px;position:relative;flex:none}
.cross:before,.cross:after{content:"";position:absolute;background:#fff;inset:0;margin:auto}
.cross:before{width:16px;height:5px}.cross:after{width:5px;height:16px}
nav{display:flex;gap:4px;padding:10px 12px 0;max-width:1000px;margin:auto;overflow-x:auto}
nav button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--mute);font:500 15px inherit;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--blue);border-color:var(--red);font-weight:700}
main{max-width:1000px;margin:auto;padding:14px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card.past{opacity:.65}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{font:500 14px inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.d{color:var(--red);border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--text);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.t{font-weight:700;font-size:17px;color:var(--blue)}
.meta{color:var(--mute);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap;margin:4px 0}
.tag{display:inline-block;background:var(--blue2);color:var(--blue);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 0 2px 4px}
header .tag{background:rgba(255,255,255,.18);color:#fff}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{text-align:center;font-size:13px;color:var(--mute);padding:4px 0;font-weight:bold}
.cal .c{background:var(--card);border:1px solid var(--line);min-height:96px;padding:3px;border-radius:6px;overflow:hidden;min-width:0}
.cal .c.o{opacity:.4}.cal .c.td{border-color:var(--red);border-width:2px}
.cal .n{font-size:12px;color:var(--mute);font-weight:700}
.cal .c.has{background:#ffd24d;border-color:#b8860b}
.cal .c.has .n{color:#3a2a00}
.chip{display:block;width:100%;text-align:right;border:1px solid rgba(0,0,0,.15);background:var(--blue2);color:var(--blue);border-radius:4px;font:12px inherit;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:500}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
dialog{border:0;border-radius:14px;padding:16px;width:min(560px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw}
#toast.s{opacity:1}
.hide{display:none!important}
.time-selects{display:flex;align-items:center;gap:4px}
.time-selects select{flex:1}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
<header>
  <h1><span class="cross"></span>מד״א · ניהול הדרכות</h1>
  <div class="row">
    <span id="who" class="tag">מצב חניך</span>
    <button class="btn" id="insb" data-i>🎨 מדריכים</button>
    <button class="btn" id="exp" data-i>ייצוא CSV</button>
    <button class="btn" id="login">כניסת מדריכים</button>
  </div>
</header>

<nav id="tabs">
  <button data-t="board" class="on">לוח שיבוצים</button>
  <button data-t="form" data-i>שיבוץ חדש</button>
</nav>

<main>
<section id="board">
  <div class="card">
    <div class="row">
      <div class="seg" id="modes">
        <button id="btn-list" class="on">רשימה</button>
        <button id="btn-cal">לוח שנה</button>
      </div>
      <div class="grow" data-i style="min-width:140px">
        <select id="fi"><option value="">כל המדריכים</option></select>
      </div>
      <div class="grow" style="min-width:140px">
        <input id="ft" type="search" placeholder="חיפוש לפי נושא…">
      </div>
    </div>
  </div>

  <div id="list-view"></div>

  <div id="cal-view" class="hide">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <button class="btn" id="cal-prev">◀ חודש קודם</button>
      <b id="cal-month-title" style="font-size:16px"></b>
      <button class="btn" id="cal-next">חודש הבא ▶</button>
    </div>
    <div class="cal" id="cal-grid"></div>
  </div>
</section>

<section id="form" class="hide">
  <form class="card" id="f" autocomplete="off">
    <h2 id="fh" style="margin-top:0">שיבוץ חדש</h2>
    <input type="hidden" id="id">
    
    <div class="grid">
      <div>
        <label for="top">נושא השיעור / המצגת *</label>
        <input id="top" required placeholder="למשל: סכמת החייאה">
      </div>
      <div>
        <label for="ins">שם המדריך *</label>
        <input id="ins" required placeholder="שם המדריך/ה">
      </div>
      <div>
        <label for="dt">תאריך *</label>
        <input id="dt" type="date" required>
      </div>
      <div>
        <label>שעת התחלה *</label>
        <div class="time-selects">
          <select id="st-h"></select><b>:</b><select id="st-m"></select>
        </div>
      </div>
      <div>
        <label>שעת סיום *</label>
        <div class="time-selects">
          <select id="en-h"></select><b>:</b><select id="en-m"></select>
        </div>
      </div>
      <div>
        <label for="loc">מיקום / כיתה / צוות יעד</label>
        <input id="loc" placeholder="למשל: כיתה א'">
      </div>
    </div>

    <div style="margin-top:12px">
      <label for="pl">תוכנית השיעור (מוצגת לחניכים)</label>
      <textarea id="pl" rows="3"></textarea>
    </div>

    <div style="margin-top:12px">
      <label style="display:flex;gap:8px;align-items:center;color:var(--text)">
        <input id="pub" type="checkbox" style="width:auto" checked> להציג שיעור זה בתצוגת החניכים
      </label>
    </div>

    <div style="margin-top:12px">
      <label for="nt">הערות פנימיות (למדריכים בלבד)</label>
      <textarea id="nt" rows="2"></textarea>
    </div>

    <div class="acts" style="margin-top:16px">
      <button class="btn p" type="submit">שמור שיבוץ</button>
      <button class="btn" type="button" id="can-btn">ביטול</button>
    </div>
  </form>
</section>
</main>

<dialog id="dlg">
  <div id="dlg-content"></div>
  <div class="row" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" id="dlg-close">סגור</button>
  </div>
</dialog>
<div id="toast"></div>

<script>
// Firebase Config
const firebaseConfig = {
  databaseURL: "https://mada-shibochim-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Application State
let isAdmin = false;
let sessions = {};
let currentMode = 'list';
let calDate = new Date();

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('s');
  setTimeout(() => t.classList.remove('s'), 3000);
}

// Time selects population
function buildTimeOptions() {
  const stH = document.getElementById('st-h'), enH = document.getElementById('en-h');
  const stM = document.getElementById('st-m'), enM = document.getElementById('en-m');
  
  let hOpt = '<option value="">שעה</option>';
  for(let i=0; i<24; i++) {
    const v = String(i).padStart(2, '0');
    hOpt += `<option value="${v}">${v}</option>`;
  }
  stH.innerHTML = enH.innerHTML = hOpt;

  let mOpt = '<option value="">דקות</option>';
  for(let i=0; i<60; i+=5) {
    const v = String(i).padStart(2, '0');
    mOpt += `<option value="${v}">${v}</option>`;
  }
  stM.innerHTML = enM.innerHTML = mOpt;
}

function getTimeValue(type) {
  const h = document.getElementById(type + '-h').value;
  const m = document.getElementById(type + '-m').value;
  return (h && m) ? `${h}:${m}` : '';
}

function setTimeValue(type, val) {
  if(!val || !val.includes(':')) {
    document.getElementById(type + '-h').value = '';
    document.getElementById(type + '-m').value = '';
    return;
  }
  const [h, m] = val.split(':');
  document.getElementById(type + '-h').value = h || '';
  document.getElementById(type + '-m').value = m || '';
}

document.addEventListener('DOMContentLoaded', () => {
  buildTimeOptions();
  
  // Navigation Tabs
  const tabBtns = document.querySelectorAll('#tabs button');
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      const target = btn.dataset.t;
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hide'));
      document.getElementById(target).classList.remove('hide');
    });
  });

  // Toggle Modes (List / Calendar)
  document.getElementById('btn-list').addEventListener('click', () => {
    document.getElementById('btn-list').classList.add('on');
    document.getElementById('btn-cal').classList.remove('on');
    document.getElementById('list-view').classList.remove('hide');
    document.getElementById('cal-view').classList.add('hide');
    currentMode = 'list';
  });

  document.getElementById('btn-cal').addEventListener('click', () => {
    document.getElementById('btn-cal').classList.add('on');
    document.getElementById('btn-list').classList.remove('on');
    document.getElementById('list-view').classList.add('hide');
    document.getElementById('cal-view').classList.remove('hide');
    currentMode = 'cal';
    renderCalendar();
  });

  // Calendar Nav
  document.getElementById('cal-prev').addEventListener('click', () => {
    calDate.setMonth(calDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calDate.setMonth(calDate.getMonth() + 1);
    renderCalendar();
  });

  // Admin Login
  const loginBtn = document.getElementById('login');
  loginBtn.addEventListener('click', () => {
    if(!isAdmin) {
      const pwd = prompt("הכנס סיסמת מדריכים:");
      if(pwd) {
        isAdmin = true;
        document.getElementById('who').textContent = "מצב מדריך פעיל";
        loginBtn.textContent = "יציאה ממצב מדריך";
        document.querySelectorAll('[data-i]').forEach(el => el.classList.remove('hide'));
        toast("התחברת בהצלחה!");
        renderAll();
      }
    } else {
      isAdmin = false;
      document.getElementById('who').textContent = "מצב חניך";
      loginBtn.textContent = "כניסת מדריכים";
      document.querySelectorAll('[data-i]').forEach(el => el.classList.add('hide'));
      toast("יצאת ממצב מדריך.");
      renderAll();
    }
  });

  // Initially hide admin buttons
  document.querySelectorAll('[data-i]').forEach(el => el.classList.add('hide'));

  // Cancel Form
  document.getElementById('can-btn').addEventListener('click', () => {
    resetForm();
    document.querySelector('[data-t="board"]').click();
  });

  // Dialog Close
  document.getElementById('dlg-close').addEventListener('click', () => {
    document.getElementById('dlg').close();
  });

  // Listeners for inputs
  document.getElementById('ft').addEventListener('input', renderAll);
  document.getElementById('fi').addEventListener('change', renderAll);

  // Form Submit
  document.getElementById('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const st = getTimeValue('st');
    const en = getTimeValue('en');
    
    if(!st || !en) {
      alert("יש לבחור שעת התחלה וסיום מלאות.");
      return;
    }

    const id = document.getElementById('id').value;
    const sessionData = {
      top: document.getElementById('top').value.trim(),
      ins: document.getElementById('ins').value.trim(),
      dt: document.getElementById('dt').value,
      st: st,
      en: en,
      loc: document.getElementById('loc').value.trim(),
      pl: document.getElementById('pl').value.trim(),
      pub: document.getElementById('pub').checked,
      nt: document.getElementById('nt').value.trim()
    };

    const targetRef = id ? db.ref('sessions/' + id) : db.ref('sessions').push();
    targetRef.set(sessionData, (err) => {
      if(err) {
        toast("שגיאה בשמירה: " + err.message);
      } else {
        toast("השיבוץ נשמר בהצלחה!");
        resetForm();
        document.querySelector('[data-t="board"]').click();
      }
    });
  });

  // Firebase Realtime Listener
  db.ref('sessions').on('value', (snapshot) => {
    sessions = snapshot.val() || {};
    renderAll();
  });
});

function resetForm() {
  document.getElementById('f').reset();
  document.getElementById('id').value = '';
  setTimeValue('st', '');
  setTimeValue('en', '');
  document.getElementById('fh').textContent = 'שיבוץ חדש';
}

function renderAll() {
  updateInstructorFilter();
  renderList();
  if(currentMode === 'cal') renderCalendar();
}

function updateInstructorFilter() {
  const sel = document.getElementById('fi');
  const curr = sel.value;
  const insList = new Set();
  
  Object.values(sessions).forEach(s => {
    if(s.ins) insList.add(s.ins);
  });

  let html = '<option value="">כל המדריכים</option>';
  insList.forEach(name => {
    html += `<option value="${name}" ${name === curr ? 'selected' : ''}>${name}</option>`;
  });
  sel.innerHTML = html;
}

function getFilteredSessions() {
  const filterText = document.getElementById('ft').value.toLowerCase();
  const filterIns = document.getElementById('fi').value;

  const keys = Object.keys(sessions).sort((a,b) => {
    const sA = sessions[a], sB = sessions[b];
    return (sA.dt + sA.st).localeCompare(sB.dt + sB.st);
  });

  return keys.filter(key => {
    const s = sessions[key];
    if(!isAdmin && s.pub === false) return false;
    if(filterIns && s.ins !== filterIns) return false;
    if(filterText && !s.top.toLowerCase().includes(filterText)) return false;
    return true;
  });
}

function renderList() {
  const listEl = document.getElementById('list-view');
  const filteredKeys = getFilteredSessions();

  if(filteredKeys.length === 0) {
    listEl.innerHTML = '<div class="empty">אין שיבוצים להצגה כרגע.</div>';
    return;
  }

  let html = '';
  filteredKeys.forEach(key => {
    const s = sessions[key];
    html += `
      <div class="card">
        <div class="t">${s.top}</div>
        <div class="meta">
          <span>📅 ${s.dt}</span>
          <span>⏰ ${s.st} - ${s.en}</span>
          <span>👤 ${s.ins}</span>
          <span>📍 ${s.loc || 'לא צויין'}</span>
        </div>
        ${s.pl ? `<div style="margin-top:6px"><b>תוכנית:</b> ${s.pl}</div>` : ''}
        ${isAdmin && s.nt ? `<div style="margin-top:6px;color:var(--red)"><b>הערות מדריך:</b> ${s.nt}</div>` : ''}
        <div class="acts">
          <button class="btn" onclick="openDetails('${key}')">פרטים מלאים</button>
          ${isAdmin ? `
            <button class="btn p" onclick="editSession('${key}')">עריכה</button>
            <button class="btn d" onclick="deleteSession('${key}')">מחיקה</button>
          ` : ''}
        </div>
      </div>
    `;
  });

  listEl.innerHTML = html;
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  const title = document.getElementById('cal-month-title');
  
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  
  const monthNames = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  title.textContent = `${monthNames[m]} ${y}`;

  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  let html = ['א','ב','ג','ד','ה','ו','ש'].map(d => `<div class="h">${d}</div>`).join('');

  for(let i=0; i<firstDay; i++) {
    html += `<div class="c o"></div>`;
  }

  const todayStr = new Date().toISOString().split('T')[0];

  for(let d=1; d<=daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    
    const dayKeys = Object.keys(sessions).filter(k => {
      const s = sessions[k];
      return s.dt === dateStr && (isAdmin || s.pub !== false);
    });

    const isToday = dateStr === todayStr ? 'td' : '';
    const hasClass = dayKeys.length > 0 ? 'has' : '';

    html += `<div class="c ${hasClass} ${isToday}">`;
    html += `<div class="n">${d}</div>`;
    
    dayKeys.forEach(k => {
      const s = sessions[k];
      html += `<button class="chip" onclick="openDetails('${k}')">${s.st} ${s.top}</button>`;
    });

    html += `</div>`;
  }

  grid.innerHTML = html;
}

function openDetails(key) {
  const s = sessions[key];
  if(!s) return;
  const dlgContent = document.getElementById('dlg-content');
  dlgContent.innerHTML = `
    <h2>${s.top}</h2>
    <p><b>תאריך:</b> ${s.dt}</p>
    <p><b>שעות:</b> ${s.st} - ${s.en}</p>
    <p><b>מדריך:</b> ${s.ins}</p>
    <p><b>מיקום:</b> ${s.loc || 'לא צויין'}</p>
    ${s.pl ? `<p><b>תוכנית השיעור:</b><br>${s.pl.replace(/\n/g,'<br>')}</p>` : ''}
    ${isAdmin && s.nt ? `<p style="color:var(--red)"><b>הערות פנימיות:</b><br>${s.nt.replace(/\n/g,'<br>')}</p>` : ''}
  `;
  document.getElementById('dlg').showModal();
}

function editSession(key) {
  const s = sessions[key];
  if(!s) return;
  
  document.getElementById('id').value = key;
  document.getElementById('top').value = s.top || '';
  document.getElementById('ins').value = s.ins || '';
  document.getElementById('dt').value = s.dt || '';
  setTimeValue('st', s.st || '');
  setTimeValue('en', s.en || '');
  document.getElementById('loc').value = s.loc || '';
  document.getElementById('pl').value = s.pl || '';
  document.getElementById('pub').checked = s.pub !== false;
  document.getElementById('nt').value = s.nt || '';
  
  document.getElementById('fh').textContent = 'עריכת שיבוץ';
  document.querySelector('[data-t="form"]').click();
}

function deleteSession(key) {
  if(confirm("להסיר שיבוץ זה?")) {
    db.ref('sessions/' + key).remove((err) => {
      if(!err) toast("השיבוץ נמחק בהצלחה.");
    });
  }
}
</script>
</body>
</html>
